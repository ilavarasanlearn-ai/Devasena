<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Random Joke Generator</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
        background: #0b5ed7; /* blue background */
        color: #fff;
      }

      .card {
        width: min(720px, 92vw);
        background: rgba(0, 0, 0, 0.25);
        padding: 24px 28px;
        border-radius: 14px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
      }

      h1 {
        margin: 0 0 14px;
        font-size: 22px;
      }

      #setup {
        font-size: 18px;
        line-height: 1.5;
        margin: 12px 0 6px;
      }

      #punchline {
        font-size: 18px;
        font-weight: 700;
        line-height: 1.5;
        margin: 6px 0 18px;
        opacity: 0.95;
      }

      .row {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }

      button {
        border: 0;
        padding: 10px 14px;
        border-radius: 10px;
        cursor: pointer;
        font-weight: 600;
      }

      #btn {
        background: #ffffff;
        color: #0b5ed7;
      }

      #btn:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }

      .muted {
        margin-top: 10px;
        font-size: 12px;
        opacity: 0.85;
      }

      .error {
        margin-top: 10px;
        padding: 10px 12px;
        border-radius: 10px;
        background: rgba(220, 53, 69, 0.25);
        border: 1px solid rgba(220, 53, 69, 0.4);
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Random Joke Generator</h1>

      <div id="setup">Click “Get Joke” to load a joke.</div>
      <div id="punchline"></div>

      <div class="row">
        <button id="btn" type="button">Get Joke</button>
      </div>

      <div id="error" class="error"></div>
      <div class="muted">API: Official Joke API</div>
    </div>

    <script>
      const btn = document.getElementById("btn");
      const setupEl = document.getElementById("setup");
      const punchlineEl = document.getElementById("punchline");
      const errorEl = document.getElementById("error");

      async function getJoke() {
        errorEl.style.display = "none";
        errorEl.textContent = "";
        punchlineEl.textContent = "";
        btn.disabled = true;
        btn.textContent = "Loading...";

        try {
          // External API call
          const res = await fetch("https://official-joke-api.appspot.com/random_joke", {
            headers: { Accept: "application/json" },
          });

          if (!res.ok) {
            throw new Error(`API error: ${res.status} ${res.statusText}`);
          }

          const data = await res.json();
          setupEl.textContent = data.setup || "No setup found.";
          punchlineEl.textContent = data.punchline || "";
        } catch (err) {
          setupEl.textContent = "Could not load a joke right now.";
          errorEl.textContent =
            "Error: " + (err && err.message ? err.message : String(err));
          errorEl.style.display = "block";
        } finally {
          btn.disabled = false;
          btn.textContent = "Get Joke";
        }
      }

      btn.addEventListener("click", getJoke);
    </script>
  </body>
</html>
